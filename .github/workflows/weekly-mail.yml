name: Weekly Summary Mail

# 매주 월요일 아침 주간 요약 메일 (Gemini 요약 + 주요 이슈 Top 10 + 국가별 건수 + 경쟁사 동향)
#   필요한 Secrets : MAIL_USER, MAIL_PASSWORD, MAIL_TO, GEMINI_API_KEY
#   선택 Variables : GEMINI_MODEL (모델 이름을 바꿀 때)
#   GitHub 예약 실행은 수십 분 늦을 수 있어 06:30 에 시작한다 (보통 7시 전 도착)
on:
  schedule:
    - cron: "30 21 * * 0"    # 월요일 06:30 KST (= 일요일 21:30 UTC)
  workflow_dispatch:
    inputs:
      send:
        description: "실제로 발송 (끄면 미리보기 파일만 만들어 Artifacts 에 올림)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  weekly:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install "requests>=2.32,<3"

      - name: Build & send weekly mail
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_SMTP_HOST: ${{ secrets.MAIL_SMTP_HOST }}
          MAIL_SMTP_PORT: ${{ secrets.MAIL_SMTP_PORT }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.send }}" != "true" ]; then
            python src/weekly_mail.py --dry-run
          else
            python src/weekly_mail.py
          fi

      - name: Upload preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-mail-preview
          path: weekly_mail_preview.html
          if-no-files-found: ignore
          retention-days: 14
