name: Country Profile — Annual (총인구·GDP·최저임금)

on:
  schedule:
    - cron: "0 0 1 1 *"   # 매년 1월 1일 09:00 KST (cron은 UTC 기준)
  workflow_dispatch:
    inputs:
      year:
        description: "기준연도(선택) — 비우면 settings.toml 또는 실행 연도"
        required: false

permissions:
  contents: write
  actions: write    # 수집 후 대시보드 갱신 워크플로(update.yml) 실행용

# 1월 1일에는 월간·연간이 동시에 시작되므로 같은 그룹으로 순서대로 실행해 커밋 충돌을 막는다
concurrency:
  group: country-profile
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Parser tests
        run: pytest -q

      - name: Collect (annual)
        env:
          TZ: Asia/Seoul
        run: python -m country_profile annual ${{ inputs.year && format('--year {0}', inputs.year) || '' }}

      - name: Commit results
        run: |
          set -u
          BR="${GITHUB_REF_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ output/
          if git diff --staged --quiet; then echo "변경 없음"; exit 0; fi
          git commit -q -m "data: country profile annual $(TZ=Asia/Seoul date +%F)"
          for i in 1 2 3; do
            echo "── push 시도 $i/3 (브랜치: $BR)"
            # --autostash: 실행 중 생긴 다른 변경 파일(캐시 등)이 있어도 rebase가 멈추지 않게 한다
            if git pull --rebase --autostash origin "$BR" 2>&1 && git push origin "HEAD:$BR" 2>&1; then
              echo "push 완료"; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "── 진단 정보"; git status --short | head -30; git log --oneline -3
          echo "::error::결과 커밋 push 실패 — 위 'push 시도' 로그의 오류 메시지를 확인하세요"; exit 1

      - name: Refresh dashboard (화면만 다시 생성)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update.yml --ref "${GITHUB_REF_NAME}" -f mode=build

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: country-profile-annual
          path: |
            output/
            data/
